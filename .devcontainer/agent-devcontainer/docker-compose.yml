name: ${COMPOSE_PROJECT_NAME}

networks:
  # Isolated network for the agent — internal:true means it has NO route to
  # the outside world. iron-proxy is dual-homed onto this network (fixed IP,
  # for DNS interception) and iron-egress (for actual internet access), so it
  # is the only way traffic can leave.
  iron-internal:
    internal: true
    ipam:
      config:
        # Explicit gateway kept out of the .1/.2 range used below — Docker
        # would otherwise auto-assign the gateway to .1 and collide with
        # iron-proxy's static address.
        - subnet: 10.77.20.0/24
          gateway: 10.77.20.254
  iron-egress: {}

services:
  iron-proxy:
    image: ironsh/iron-proxy:latest
    restart: unless-stopped
    command: ["-config", "/etc/iron-proxy/proxy.yaml"]
    networks:
      iron-internal:
        ipv4_address: 10.77.20.1
      iron-egress: {}
    volumes:
      - ./config/proxy.yaml:/etc/iron-proxy/proxy.yaml:ro

  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    networks:
      iron-internal:
        ipv4_address: 10.77.20.2
    working_dir: /workspaces/${WORKSPACE_NAME}
    # Force all DNS resolution through iron-proxy — combined with the
    # internal-only network above, this is what forces every request out
    # through the proxy rather than relying on apps honoring proxy env vars.
    dns:
      - 10.77.20.1
    environment:
      # Lets an agent running in here tell it apart from the human
      # devcontainer (same image) — see the sandbox-awareness skill.
      - HARDENED_CONTAINER=1
    volumes:
      - ../..:/workspaces/${WORKSPACE_NAME}:cached
      - node-modules:/workspaces/${WORKSPACE_NAME}/node_modules
      # Persists across container recreation so `claude`/`copilot` (and
      # anything else under $HOME) don't need to re-authenticate every time
      # the sandbox is torn down and stood back up.
      - developer-home:/home/developer
      # The repo bind-mount above pulls in .devcontainer/agent-devcontainer
      # wholesale, which would otherwise hand the agent the generated .env
      # and the host-side shell-session tracking used by agent.js. Shadow
      # both so the agent never sees the real files, without excluding them
      # from the host-side checkout.
      - /dev/null:/workspaces/${WORKSPACE_NAME}/.devcontainer/agent-devcontainer/.env:ro
    tmpfs:
      - /workspaces/${WORKSPACE_NAME}/.devcontainer/agent-devcontainer/.sessions
    # No published ports here, deliberately: agent's only network
    # (iron-internal) is internal:true, and Docker silently refuses to
    # publish ports for a container whose only network is internal — that's
    # the same mechanism blocking egress, so it can't be worked around
    # without a second, non-internal network that would reopen a route out.
    # View the rendered slides from the human devcontainer instead.
    command: sleep infinity
    depends_on:
      - iron-proxy

volumes:
  node-modules:
  developer-home:
